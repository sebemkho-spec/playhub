<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 270" role="img" aria-label="A padlock">
  <!-- A hand-drawn padlock (the locked Gallery card): periwinkle body, a white shackle and
       keyhole, a slightly misprinted fill and a shadow to the lower right, tilted like a doodle. -->
  <defs>
    <clipPath id="lock-body">
      <path d="M41 128c-1-10 6-16 16-16l112-3c11 0 18 5 19 16l3 90c1 11-6 18-17 19l-115 4c-11 0-17-6-17-16z" />
    </clipPath>
  </defs>
  <g transform="rotate(15 115 150)" stroke-linecap="round" stroke-linejoin="round">
    <!-- shadow -->
    <path d="M70 116V76c0-30 22-49 48-49s47 20 47 50v38" fill="none" stroke="#bfc8e6" stroke-width="27" transform="translate(7 4)" />
    <path d="M41 128c-1-10 6-16 16-16l112-3c11 0 18 5 19 16l3 90c1 11-6 18-17 19l-115 4c-11 0-17-6-17-16z" fill="#bfc8e6" transform="translate(8 9)" />
    <!-- shackle: black outline, white face -->
    <path d="M70 116V76c0-30 22-49 48-49s47 20 47 50v38" fill="none" stroke="#141414" stroke-width="29" />
    <path d="M70 116V76c0-30 22-49 48-49s47 20 47 50v38" fill="none" stroke="#ffffff" stroke-width="20" />
    <path d="M158 112V79c0-22-12-38-28-43" fill="none" stroke="#c9d1ec" stroke-width="5" />
    <!-- body: white, then the periwinkle fill printed a little off to the lower right -->
    <path d="M41 128c-1-10 6-16 16-16l112-3c11 0 18 5 19 16l3 90c1 11-6 18-17 19l-115 4c-11 0-17-6-17-16z" fill="#ffffff" />
    <g clip-path="url(#lock-body)">
      <path d="M41 128c-1-10 6-16 16-16l112-3c11 0 18 5 19 16l3 90c1 11-6 18-17 19l-115 4c-11 0-17-6-17-16z" fill="#bfc8e6" transform="translate(7 6)" />
    </g>
    <path d="M41 128c-1-10 6-16 16-16l112-3c11 0 18 5 19 16l3 90c1 11-6 18-17 19l-115 4c-11 0-17-6-17-16z" fill="none" stroke="#141414" stroke-width="5.5" />
    <!-- a second, thinner pencil line, as if sketched twice -->
    <path d="M44 133c0-9 6-14 15-15l108-2c9 0 15 4 16 13l3 85c1 9-5 15-14 16" fill="none" stroke="#141414" stroke-width="1.8" opacity="0.55" />
    <path d="M38 222c1 8 6 13 16 13l114-4" fill="none" stroke="#141414" stroke-width="2.2" opacity="0.6" transform="translate(2 5)" />
    <!-- keyhole -->
    <path d="M115 150c-9 0-15 6-15 14 0 5 2 9 6 12l-8 28c-1 3 1 5 4 5h27c3 0 5-2 4-5l-8-28c4-3 6-7 6-12 0-8-7-14-16-14z" fill="#ffffff" stroke="#141414" stroke-width="5" />
  </g>
</svg>
